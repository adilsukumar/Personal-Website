<svg xmlns="http://www.w3.org/2000/svg" width="640" height="465" viewBox="0 0 640 465" role="img" aria-labelledby="t d"><title id="t">The main portfolio and resume collection are two separately deployed sites in one repository.</title><desc id="d">Illustrative README artwork inspired by the portfolio. Not a captured page or a live rendering benchmark.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}@keyframes constellation{0%,100%{opacity:.28}50%{opacity:.95}}.constellation{animation:constellation 8s ease-in-out infinite}@keyframes meridian{0%,100%{transform:scaleX(.72)}50%{transform:scaleX(1)}}.meridian{animation:meridian 13s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.constellation,.meridian{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="14" width="592" height="205" rx="14" fill="#151420" stroke="#363348"/><g class="constellation"><g transform="translate(47 38) scale(0.8181818181818182)"><path d="M22 3a19 19 0 1 0 0 38a19 19 0 1 0 0-38M3 22h38M22 3c-13 10-13 28 0 38M22 3c13 10 13 28 0 38" fill="none" stroke="#BCFCF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="65" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">MAIN PORTFOLIO</text><text x="48" y="121" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">www.adilsukumar.xyz</text><path d="M48 150h544" fill="none" stroke="#363348" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="48" y="191" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">ONE REPOSITORY / SEPARATE DEPLOYMENT</text><rect x="24" y="240" width="592" height="205" rx="14" fill="#151420" stroke="#363348"/><g class="constellation"><g transform="translate(47 264) scale(0.8181818181818182)"><path d="M7 3h22l9 10v28H7zM28 3v11h10M13 22h18M13 29h18M13 36h11" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="102" y="291" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">RESUME COLLECTION</text><text x="48" y="347" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">www.resume.adilsukumar.xyz</text><path d="M48 376h544" fill="none" stroke="#363348" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="48" y="417" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">ONE REPOSITORY / SEPARATE DEPLOYMENT</text></svg>