<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150" role="img" aria-labelledby="t d"><title id="t">Resume site. Static source, six PDFs and deployment notes</title><desc id="d">Illustrative README artwork inspired by the portfolio. Not a captured page or a live rendering benchmark.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}@keyframes constellation{0%,100%{opacity:.28}50%{opacity:.95}}.constellation{animation:constellation 8s ease-in-out infinite}@keyframes meridian{0%,100%{transform:scaleX(.72)}50%{transform:scaleX(1)}}.meridian{animation:meridian 13s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.constellation,.meridian{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="2" y="2" width="516" height="145" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(22 24) scale(0.8636363636363636)"><path d="M7 3h22l9 10v28H7zM28 3v11h10M13 22h18M13 29h18M13 36h11" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="78" y="51" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" t