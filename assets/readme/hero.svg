<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1620" viewBox="0 0 1120 1620" role="img" aria-labelledby="t d"><title id="t">Adil Sukumar. Personal Website. A place for the work and what comes next. Concept globe artwork.</title><desc id="d">Illustrative README artwork inspired by the portfolio. Not a captured page or a live rendering benchmark.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}@keyframes constellation{0%,100%{opacity:.28}50%{opacity:.95}}.constellation{animation:constellation 8s ease-in-out infinite}@keyframes meridian{0%,100%{transform:scaleX(.72)}50%{transform:scaleX(1)}}.meridian{animation:meridian 13s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.constellation,.meridian{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><path d="M30 28H1090" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="73" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">ADIL SUKUMAR / PERSONAL WEBSITE</text><text x="24" y="344" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="2