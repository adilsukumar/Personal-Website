<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1210" viewBox="0 0 640 1210" role="img" aria-labelledby="t d"><title id="t">Built to be explored. Kept in the source. Adil Sukumar personal website.</title><desc id="d">Illustrative README artwork inspired by the portfolio. Not a captured page or a live rendering benchmark.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes care{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.care{animation:care 10s ease-in-out infinite}@keyframes respond{0%,100%{opacity:.4}50%{opacity:1}}.respond{animation:respond 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.care,.respond{animation:none!important}}@keyframes constellation{0%,100%{opacity:.28}50%{opacity:.95}}.constellation{animation:constellation 8s ease-in-out infinite}@keyframes meridian{0%,100%{transform:scaleX(.72)}50%{transform:scaleX(1)}}.meridian{animation:meridian 13s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.constellation,.meridian{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><path d="M30 28H610" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="74" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">ADIL SUKUMAR / BUILT IN THE OPEN</text><text x="32" y="190" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="45" font-weight="700" text-anchor="start">Built to be explored.</text><text x="32" y="291" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="47" font-weight="600" text-anchor="start">Kept in the source.</text><text x="32" y="386" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Projects, experience, a</text><text x="32" y="420" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">conversation and the next thing to</text><text x="32" y="454" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">build.</text><g transform="translate(68 626) scale(1.1)"><circle class="constellation" style="animation-delay:-0.0s" cx="11" cy="19" r="1.0" fill="#FF4081"/><circle class="constellation" style="animation-delay:-0.43s" cx="94" cy="126" r="1.6" fill="#BCFCF6"/><circle class="constellation" style="animation-delay:-0.86s" cx="177" cy="233" r="2.2" fill="#A783F7"/><circle class="constellation" style="animation-delay:-1.29s" cx="260" cy="340" r="1.0" fill="#F3D962"/><circle class="constellation" style="animation-delay:-1.72s" cx="343" cy="65" r="1.6" fill="#FF4081"/><circle class="constellation" style="animation-delay:-2.15s" cx="426" cy="172" r="2.2" fill="#BCFCF6"/><circle class="constellation" style="animation-delay:-2.58s" cx="59" cy="279" r="1.0" fill="#A783F7"/><circle class="constellation" style="animation-delay:-3.01s" cx="142" cy="4" r="1.6" fill="#F3D962"/><circle class="constellation" style="animation-delay:-3.44s" cx="225" cy="111" r="2.2" fill="#FF4081"/><circle class="constellation" style="animation-delay:-3.87s" cx="308" cy="218" r="1.0" fill="#BCFCF6"/><circle class="constellation" style="animation-delay:-4.3s" cx="391" cy="325" r="1.6" fill="#A783F7"/><circle class="constellation" style="animation-delay:-4.7299999999999995s" cx="24" cy="50" r="2.2" fill="#F3D962"/><circle class="constellation